name: engine-ci

# Build + correctness + sanitizers + static analysis for the C++ engine.
# The Racket interpreter is the differential-test oracle, so racket is required.

on:
  push:
    paths: ['engine/**', '.github/workflows/ci.yml', 'interpreter.rkt']
  pull_request:
    paths: ['engine/**', '.github/workflows/ci.yml', 'interpreter.rkt']

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ racket clang-tidy cppcheck valgrind

      - name: Build (strict, -Werror)
        # No -march=native in CI: the runner and the build host may differ.
        run: make OPT="-O3 -DNDEBUG"

      - name: Differential test vs Racket oracle
        run: make test OPT="-O3 -DNDEBUG"

      - name: Zero-allocation audit
        run: make alloc-audit OPT="-O3 -DNDEBUG"

      - name: Sanitizers (ASan + UBSan)
        run: make sanitize

      - name: Static analysis (clang-tidy + cppcheck)
        run: make lint
